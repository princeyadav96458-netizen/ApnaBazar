<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApnaBazaar - Super Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes scanLaser {
      0% { top: 8%; opacity: 0.9; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.9; }
    }
    .laser-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
      box-shadow: 0 0 18px 4px rgba(59, 130, 246, 0.85);
      animation: scanLaser 1.7s ease-in-out infinite;
    }
    .reels-container {
      scroll-snap-type: y mandatory;
      height: calc(100vh - 64px);
    }
    .reel-item {
      scroll-snap-align: start;
      height: calc(100vh - 64px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==================== CONFIG & CONSTANTS ====================
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/bg6zs3rmlijte';
    const DEFAULT_ADMIN_PIN = '542275';

    const CATEGORIES = [
      { id: 'All', label: 'All Items', icon: '🏪' },
      { id: 'Food & Groceries', label: 'Food & Kitchen', icon: '🌾' },
      { id: 'Fresh Vegetables', label: 'Hari Sabji', icon: '🥦' },
      { id: 'Fresh Fruits', label: 'Fresh Fruits', icon: '🍎' },
      { id: "Men's Clothing", label: "Men's Wear", icon: '👔' },
      { id: "Women's Clothing", label: "Women's Wear", icon: '👗' },
      { id: 'Footwear & Shoes', label: 'Shoes & Footwear', icon: '👟' },
      { id: 'Books & School Supplies', label: 'Books & School', icon: '📚' }
    ];

    const SAMPLE_PRODUCTS = [
      {

      },
      {

        short_video_url: 'https://assets.mixkit.co/videos/preview/mixkit-fresh-vegetables-on-a-market-stall-42918-large.mp4',

      {

        short_video_url: 'https://assets.mixkit.co/videos/preview/mixkit-young-man-looking-at-clothes-in-a-store-42908-large.mp4',

      },
      {

        name: "Women's Designer Printed Kurti & Dupatta Set",

        price: 649,
        image_url: 'https://images.unsplash.com/photo-1583391733956-6c78276477e2?auto=format&fit=crop&w=600&q=80',
        description: 'Elegant ethnic rayon kurti set with matching dupatta.',
        short_video_url: 'https://assets.mixkit.co/videos/preview/mixkit-woman-in-traditional-dress-smiling-42905-large.mp4',
        stock: 25,

      },
      {
        id: 'PRD-106',
        name: 'Ultra-Light Running & Walking Sports Shoes',
        category: 'Footwear & Shoes',
        price: 799,
        image_url: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80',
        description: 'Cushioned EVA sole sneakers for men and women.',
        short_video_url: 'https://assets.mixkit.co/videos/preview/mixkit-person-tying-running-shoes-42901-large.mp4',
        stock: 18,
        isSample: true
      },
      {
        id: 'PRD-107',
        name: 'All Classes NCERT Books (Class 1–12) + Spiral Notebooks',
        category: 'Books & School Supplies',
        price: 450,
        image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
        description: 'Complete class textbooks, ruled registers, geometry box & school bag combo.',
        short_video_url: 'https://assets.mixkit.co/videos/preview/mixkit-student-writing-in-a-notebook-42898-large.mp4',
        stock: 50,
        isSample: true
      }
    ];

    // ==================== INLINE SVG ICONS ====================
    const Icon = ({ name, className = 'w-5 h-5' }) => {
      const icons = {
        bag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        camera: (
          <>
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </>
        ),
        scan: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2m8-16h2a2 2 0 012 2v2m0 8v2a2 2 0 01-2 2h-2M7 12h10" />,
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
        video: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        cart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />,
        refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
        copy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />,
        lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    // ==================== MAIN APP COMPONENT ====================
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [lensMatchedTag, setLensMatchedTag] = useState('');

      // Data States
      const [products, setProducts] = useState(SAMPLE_PRODUCTS);
      const [productSheetTab, setProductSheetTab] = useState('Product');
      const [orders, setOrders] = useState([]);
      const [settings, setSettings] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('apnabazaar_settings')) || {
            upi_id: 'apnabazaar@upi',
            upi_name: 'ApnaBazaar Store',
            qr_image_url: '',
            support_phone: '9876543210'
          };
        } catch {
          return { upi_id: 'apnabazaar@upi', upi_name: 'ApnaBazaar Store', qr_image_url: '', support_phone: '9876543210' };
        }
      });

      const [cart, setCart] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('apnabazaar_cart')) || [];
        } catch {
          return [];
        }
      });

      // Sync & Modals
      const [isSyncing, setIsSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [modalMediaMode, setModalMediaMode] = useState('photo');
      const [lensOpen, setLensOpen] = useState(false);
      const [lensPreview, setLensPreview] = useState('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80');
      const [isScanning, setIsScanning] = useState(false);
      const [orderSuccessReceipt, setOrderSuccessReceipt] = useState(null);

      // Admin Security & State
      const [adminPin, setAdminPin] = useState(() => localStorage.getItem('apnabazaar_admin_pin') || DEFAULT_ADMIN_PIN);
      const [pinInput, setPinInput] = useState('');
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminSubTab, setAdminSubTab] = useState('products');

      // Admin Form States
      const [editingProdId, setEditingProdId] = useState(null);
      const [prodForm, setProdForm] = useState({
        name: '',
        category: 'Food & Groceries',
        price: '',
        image_url: '',
        description: '',
        short_video_url: '',
        stock: '25'
      });
      const [settingsForm, setSettingsForm] = useState(settings);
      const [newPinInput, setNewPinInput] = useState('');
      const [confirmPinInput, setConfirmPinInput] = useState('');

      // Checkout Form States
      const [checkoutForm, setCheckoutForm] = useState({
        customer_name: '',
        phone: '',
        address: '',
        utr_number: ''
      });
      const [submittingOrder, setSubmittingOrder] = useState(false);
      const [savingProduct, setSavingProduct] = useState(false);
      const [savingSettings, setSavingSettings] = useState(false);

      const showToast = (msg, isError = false) => {
        setToast({ msg, isError });
        setTimeout(() => setToast(null), 2800);
      };

      // ==================== SHEETDB SYNC ====================
      const fetchProducts = async (notify = false) => {
        try {
          let res = await fetch(`${SHEETDB_URL}?sheet=Product`);
          let usedTab = 'Product';
          if (!res.ok) {
            res = await fetch(`${SHEETDB_URL}?sheet=Products`);
            if (res.ok) usedTab = 'Products';
          }
          if (res.ok) {
            setProductSheetTab(usedTab);
            const rows = await res.json();
            const valid = Array.isArray(rows) ? rows.filter(r => r && r.name && String(r.name).trim() !== '') : [];
            if (valid.length > 0) {
              const mapped = valid.map((r, idx) => ({
                id: String(r.id || `SHEET-${idx + 1}`),
                name: String(r.name || ''),
                category: String(r.category || 'Food & Groceries'),
                price: Number(r.price) || 0,
                image_url: String(r.image_url || 'https://placehold.co/400x400/e2e8f0/475569?text=Product'),
                description: String(r.description || ''),
                short_video_url: String(r.short_video_url || ''),
                stock: Number(r.stock) || 10,
                isSample: false
              }));
              setProducts([...mapped, ...SAMPLE_PRODUCTS]);
            } else {
              setProducts([...SAMPLE_PRODUCTS]);
            }
            if (notify) showToast('Products synced from Google Sheet!');
          }
        } catch (err) {
          if (notify) showToast('Could not fetch products from Sheet', true);
        }
      };

      const fetchSettings = async () => {
        try {
          const res = await fetch(`${SHEETDB_URL}?sheet=Settings`);
          if (res.ok) {
            const rows = await res.json();
            if (Array.isArray(rows) && rows.length > 0) {
              const latest = rows[rows.length - 1];
              if (latest.upi_id || latest.upi_name) {
                const updated = {
                  upi_id: String(latest.upi_id || settings.upi_id),
                  upi_name: String(latest.upi_name || settings.upi_name),
                  qr_image_url: String(latest.qr_image_url || ''),
                  support_phone: String(latest.support_phone || settings.support_phone)
                };
                setSettings(updated);
                setSettingsForm(updated);
                localStorage.setItem('apnabazaar_settings', JSON.stringify(updated));
              }
            }
          }
        } catch {}
      };

      const fetchOrders = async (notify = false) => {
        try {
          const res = await fetch(SHEETDB_URL);
          if (res.ok) {
            const rows = await res.json();
            if (Array.isArray(rows)) {
              const validOrders = rows
                .filter(r => r && (r.order_id || r.customer_name || r.utr_number))
                .reverse();
              setOrders(validOrders);
              if (notify) showToast('Orders refreshed!');
            }
          }
        } catch {
          if (notify) showToast('Failed to load orders', true);
        }
      };

      const syncAll = async (notify = false) => {
        setIsSyncing(true);
        await Promise.all([fetchProducts(false), fetchSettings(), fetchOrders(false)]);
        setIsSyncing(false);
        if (notify) showToast('Google Sheet synced successfully!');
      };

      useEffect(() => {
        syncAll(false);
      }, []);

      useEffect(() => {
        localStorage.setItem('apnabazaar_cart', JSON.stringify(cart));
      }, [cart]);

      // ==================== CART HELPERS ====================
      const addToCart = (prodId) => {
        setCart(prev => {
          const found = prev.find(i => i.id === prodId);
          if (found) return prev.map(i => i.id === prodId ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { id: prodId, qty: 1 }];
        });
        showToast('Added to cart!');
      };

      const updateCartQty = (prodId, delta) => {
        setCart(prev =>
          prev
            .map(i => i.id === prodId ? { ...i, qty: i.qty + delta } : i)
            .filter(i => i.qty > 0)
        );
      };

      const totalCartCount = cart.reduce((s, i) => s + i.qty, 0);
      const cartSubtotal = cart.reduce((sum, item) => {
        const p = products.find(pr => pr.id === item.id);
        return sum + (p ? p.price * item.qty : 0);
      }, 0);

      // ==================== VISUAL LENS SEARCH ====================
      const handleLensUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const fname = file.name.toLowerCase();
          let tag = 'fresh';
          if (fname.includes('shoe') || fname.includes('sneaker')) tag = 'shoes';
          else if (fname.includes('book') || fname.includes('note') || fname.includes('ncert')) tag = 'books';
          else if (fname.includes('shirt') || fname.includes('kurti') || fname.includes('cloth')) tag = 'clothing';
          else if (fname.includes('veg') || fname.includes('sabji')) tag = 'vegetables';
          else if (fname.includes('fruit') || fname.includes('apple')) tag = 'fruits';
          else {
            const tags = ['shoes', 'vegetables', 'books', 'clothing', 'fruits', 'atta'];
            tag = tags[Math.floor(Math.random() * tags.length)];
          }
          triggerVisualScan(tag, ev.target.result);
        };
        reader.readAsDataURL(file);
      };

      const triggerVisualScan = (keyword, imgUrl) => {
        setLensPreview(imgUrl);
        setIsScanning(true);
        setTimeout(() => {
          setIsScanning(false);
          setLensOpen(false);
          setActiveTab('home');
          setSelectedCategory('All');
          setSearchQuery(keyword);
          setLensMatchedTag(keyword.toUpperCase());
          showToast(`Visual Scan Match: ${keyword}`);
        }, 1350);
      };

      // ==================== ORDER SUBMISSION ====================
      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        setSubmittingOrder(true);

        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        const itemSummary = cart
          .map(c => {
            const p = products.find(pr => pr.id === c.id);
            return p ? `${p.name} (x${c.qty})` : '';
          })
          .filter(Boolean)
          .join(', ');

        const payload = {
          order_id: orderId,
          customer_name: checkoutForm.customer_name.trim(),
          phone: checkoutForm.phone.trim(),
          address: checkoutForm.address.trim(),
          items: itemSummary,
          total_amount: String(cartSubtotal),
          payment_method: 'UPI',
          utr_number: checkoutForm.utr_number.trim(),
          status: 'Pending',
          timestamp: new Date().toLocaleString('en-IN')
        };

        try {
          const res = await fetch(SHEETDB_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: [payload] })
          });
          if (!res.ok) throw new Error('Order POST failed');

          setOrders(prev => [payload, ...prev]);
          setCart([]);
          setCheckoutForm({ customer_name: '', phone: '', address: '', utr_number: '' });
          setOrderSuccessReceipt(payload);
        } catch {
          showToast('Order bhejne mein error aaya, kripya dubara try karein.', true);
        } finally {
          setSubmittingOrder(false);
        }
      };

      // ==================== ADMIN HANDLERS ====================
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === adminPin) {
          setIsAdminAuth(true);
          setPinInput('');
          fetchOrders(false);
          showToast('Admin Panel Unlocked');
        } else {
          setPinInput('');
          showToast('Incorrect Admin PIN!', true);
        }
      };

      const handleChangeAdminPin = (e) => {
        e.preventDefault();
        const cleaned = newPinInput.trim();
        if (!/^\d{4,6}$/.test(cleaned)) {
          showToast('PIN must be 4 to 6 digits only', true);
          return;
        }
        if (cleaned !== confirmPinInput.trim()) {
          showToast('New PIN and Confirm PIN do not match', true);
          return;
        }
        localStorage.setItem('apnabazaar_admin_pin', cleaned);
        setAdminPin(cleaned);
        setNewPinInput('');
        setConfirmPinInput('');
        showToast('Admin PIN successfully updated!');
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        setSavingProduct(true);

        const productObj = {
          id: editingProdId || 'PRD-' + Date.now().toString().slice(-6),
          name: prodForm.name.trim(),
          category: prodForm.category,
          price: String(prodForm.price),
          image_url: prodForm.image_url.trim(),
          description: prodForm.description.trim() || 'Quality assured product',
          short_video_url: prodForm.short_video_url.trim(),
          stock: String(prodForm.stock || 20)
        };

        try {
          let res;
          if (editingProdId) {
            res = await fetch(`${SHEETDB_URL}/id/${encodeURIComponent(editingProdId)}?sheet=${encodeURIComponent(productSheetTab)}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: productObj })
            });
          } else {
            res = await fetch(`${SHEETDB_URL}?sheet=${encodeURIComponent(productSheetTab)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [productObj] })
            });
            if (!res.ok) {
              const fallback = productSheetTab === 'Product' ? 'Products' : 'Product';
              res = await fetch(`${SHEETDB_URL}?sheet=${fallback}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [productObj] })
              });
              if (res.ok) setProductSheetTab(fallback);
            }
          }

          if (!res.ok) throw new Error('Product save failed');

          const numericProd = {
            ...productObj,
            price: Number(productObj.price),
            stock: Number(productObj.stock),
            isSample: false
          };

          if (editingProdId) {
            setProducts(prev => prev.map(p => p.id === editingProdId ? numericProd : p));
            showToast('Product updated in Google Sheet!');
          } else {
            setProducts(prev => [numericProd, ...prev]);
            showToast('New Product & Video saved to Google Sheet!');
          }

          setEditingProdId(null);
          setProdForm({
            name: '',
            category: 'Food & Groceries',
            price: '',
            image_url: '',
            description: '',
            short_video_url: '',
            stock: '25'
          });
        } catch {
          showToast('Error saving product. Check Google Sheet tab name.', true);
        } finally {
          setSavingProduct(false);
        }
      };

      const startEditProduct = (p) => {
        if (p.isSample) {
          showToast('Demo item cannot be edited in Sheet. Add as new product!', true);
          return;
        }
        setEditingProdId(p.id);
        setProdForm({
          name: p.name,
          category: p.category,
          price: String(p.price),
          image_url: p.image_url,
          description: p.description || '',
          short_video_url: p.short_video_url || '',
          stock: String(p.stock || 10)
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteProduct = async (p) => {
        if (p.isSample) {
          setProducts(prev => prev.filter(item => item.id !== p.id));
          showToast('Demo item hidden');
          return;
        }
        try {
          await fetch(`${SHEETDB_URL}/id/${encodeURIComponent(p.id)}?sheet=${encodeURIComponent(productSheetTab)}`, {
            method: 'DELETE'
          });
          setProducts(prev => prev.filter(item => item.id !== p.id));
          showToast('Product deleted from Google Sheet');
        } catch {
          showToast('Failed to delete product', true);
        }
      };

      const handleSaveSettings = async (e) => {
        e.preventDefault();
        setSavingSettings(true);
        try {
          const res = await fetch(`${SHEETDB_URL}?sheet=Settings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: [settingsForm] })
          });
          if (!res.ok) throw new Error('Settings save failed');
          setSettings(settingsForm);
          localStorage.setItem('apnabazaar_settings', JSON.stringify(settingsForm));
          showToast('UPI & Store Settings saved to Google Sheet!');

          showToast('Failed to save settings to Sheet', true);
        } finally {
          setSavingSettings(false);
        }

        setOrders(prev => prev.map(o => o.order_id === orderId ? { ...o, status: newStatus } : o));

          await fetch(`${SHEETDB_URL}/order_id/${encodeURIComponent(orderId)}`, {

            headers: { 'Content-Type': 'application/json' },

        el.value = settings.upi_id;
        document.body.appendChild(el);

        showToast(`UPI ID Copied: ${settings.upi_id}`);

      // ==================== FILTERED PRODUCTS ====================
      const filteredProducts = products.filter(p => {

        const q = searchQuery.trim().toLowerCase();
        const matchSearch =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          (p.description && p.description.toLowerCase().includes(q));
        return matchCat && matchSearch;

                  <button

                      <button
                        type="button"
                        onClick={() => setModalMediaMode('video')}
                        className={`text-xs font-bold px-3 py-1 rounded-full shadow ${modalMediaMode === 'video' ? 'bg-rose-600 text-white' : 'bg-black/60 text-white'}`}
                      >
                        ▶ Short Video
                      </button>
                    </div>
                  )}
                </div>

                <div className="p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full">{selectedProduct.category}</span>
                    <span className="text-xs font-semibold text-emerald-600">In Stock ({selectedProduct.stock})</span>
                  </div>
                  <h3 className="font-extrabold text-lg text-slate-900 leading-snug">{selectedProduct.name}</h3>
                  <div className="font-extrabold text-2xl text-slate-900">₹{selectedProduct.price}</div>
                  <p className="text-xs text-slate-600 leading-relaxed">{selectedProduct.description}</p>
                  <div className="grid grid-cols-2 gap-2.5 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        addToCart(selectedProduct.id);
                        setSelectedProduct(null);
                      }}
                      className="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold py-3 rounded-xl text-sm shadow"
                    >
                      + Add to Cart
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        addToCart(selectedProduct.id);
                        setSelectedProduct(null);
                        setActiveTab('cart');
                      }}
                      className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl text-sm shadow"
                    >
                      Buy Now
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==================== ORDER SUCCESS MODAL ==================== */}
          {orderSuccessReceipt && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-3 shadow-2xl">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="check" className="w-8 h-8" />
                </div>
                <h3 className="font-extrabold text-xl text-slate-900">Order Confirmed!</h3>
                <p className="text-xs text-slate-500">Aapka order aur UPI UTR number Google Sheet mein save ho gaya hai.</p>
                <div className="bg-slate-50 rounded-xl p-3 text-left text-xs space-y-1 border border-slate-200">
                  <p><strong>Order ID:</strong> <span className="font-mono">{orderSuccessReceipt.order_id}</span></p>
                  <p><strong>UTR Paid:</strong> <span className="font-mono text-blue-700">{orderSuccessReceipt.utr_number}</span></p>
                  <p><strong>Total Paid:</strong> <span className="font-bold text-emerald-700">₹{orderSuccessReceipt.total_amount}</span></p>
                </div>
                <button
                  type="button"
                  onClick={() => {
                    setOrderSuccessReceipt(null);
                    setActiveTab('home');
                  }}
                  className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm"
                >
                  Continue Shopping
                </button>
              </div>
            </div>
          )}

          {/* ==================== BOTTOM NAVIGATION BAR ==================== */}
          <nav className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 shadow-lg">
            <div className="max-w-lg mx-auto grid grid-cols-4 h-16">
              <button
                type="button"
                onClick={() => setActiveTab('home')}
                className={`flex flex-col items-center justify-center text-[11px] gap-1 ${activeTab === 'home' ? 'text-blue-600 font-bold' : 'text-slate-500 font-medium'}`}
              >
                <Icon name="home" className="w-5 h-5" />
                <span>Home</span>
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('reels')}
                className={`flex flex-col items-center justify-center text-[11px] gap-1 ${activeTab === 'reels' ? 'text-blue-600 font-bold' : 'text-slate-500 font-medium'}`}
              >
                <Icon name="video" className="w-5 h-5" />
                <span>Short Videos</span>
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('cart')}
                className={`flex flex-col items-center justify-center text-[11px] gap-1 ${activeTab === 'cart' ? 'text-blue-600 font-bold' : 'text-slate-500 font-medium'}`}
              >
                <div className="relative">
                  <Icon name="cart" className="w-5 h-5" />
                  {totalCartCount > 0 && (
                    <span className="absolute -top-1.5 -right-2.5 bg-rose-600 text-white text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">
                      {totalCartCount}
                    </span>
                  )}
                </div>
                <span>Cart</span>
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('admin')}
                className={`flex flex-col items-center justify-center text-[11px] gap-1 ${activeTab === 'admin' ? 'text-blue-600 font-bold' : 'text-slate-500 font-medium'}`}
              >
                <Icon name="shield" className="w-5 h-5" />
                <span>Admin</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
